name: Backend API Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: backend

    steps:
      - uses: actions/checkout@v4

      - name: Build & deploy backend
        run: |
          cd /home/popcornpalace/deployment/stacks/web-project
          docker compose up -d --build --no-deps backend-api
